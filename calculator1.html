<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora para Descobrir Nota Mínima para o 3º Trimestre No Cetec</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <a href="https://www.ucs.br/site/cetec" target="_blank">
                <img src="Imagens/CETEC-Logo.jpg" alt="Logo da Escola" class="logo">
            </a>
        </div>

        <h1>Descubra a Nota Mínima do 3º Trimestre no CETEC</h1>

        <h2>Disciplinas Regulares</h2>
        <div id="disciplinas-regulares" class="materias-container"></div>

        <h2>Itinerário</h2>
        <div id="disciplinas-itinerario" class="materias-container"></div>

        <div class="button-container">
            <button onclick="calcularNotas()">Calcular Nota Mínima</button>
            <button onclick="salvarNotas()">Salvar Notas</button>
            <button onclick="carregarNotas()">Carregar Notas</button>
            
        </div>

        <h1 id="resultado-titulo" style="text-align:center; margin-top:20px; display:none;">Resultados:</h1>
        <div id="resultado"></div>
        <div style="display: flex; justify-content: flex-end; margin-top: 15px;">
           <button id="botao-baixar" onclick="baixarResultado()" style="display:none; float: right;">Baixar Resultados</button>
        </div>
    </div>

    <div class="watermark">by Cauã Melo K3 2025</div>

    <script src="script1.js"></script>
</body>
</html>
